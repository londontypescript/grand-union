name: Vocabulary proposal
description: Propose a new component or layout option for the shared Vocabulary contract.
labels: [vocabulary]
body:
  - type: markdown
    attributes:
      value: |
        Adding to `Vocabulary` breaks all three registries until each
        implements it — see `CONTRIBUTING.md` § "Changing the vocabulary".
        This issue is for agreeing the shape *before* that PR, particularly
        the r3f question, which is the one most proposals fail on.

  - type: input
    id: component
    attributes:
      label: Component or prop proposed
      description: >-
        Name and shape, e.g. "Callout: { tone: 'info' | 'warning' }".
    validations:
      required: true

  - type: textarea
    id: r3f
    attributes:
      label: How does react-three-fiber honour it?
      description: r3f is the least layout-capable renderer and is the arbiter — be specific about the uikit/Yoga primitives involved, not just "it should be possible".
    validations:
      required: true

  - type: textarea
    id: ink
    attributes:
      label: How does ink honour it?
    validations:
      required: true

  - type: textarea
    id: dom
    attributes:
      label: How does react-dom honour it?
    validations:
      required: true

  - type: textarea
    id: grows-layout
    attributes:
      label: Does this grow the layout vocabulary?
      description: >
        If this adds a new closed-union layout option (rather than a content
        component), say so explicitly. The project's kill criterion, recorded
        in ADR 0002 (which arrives with Phase 2, issue #3), applies: if a
        page can't be expressed in r3f without the layout
        vocabulary growing past roughly a dozen options, the abstraction is
        wrong — that's a reason to reconsider the proposal, not to raise the
        limit.
    validations:
      required: true
