packages:
  - packages/*
  - apps/*
  - tests/*

# Versions shared across every package/app that needs them, so React (and the
# other cross-cutting tools) is pinned to exactly one version workspace-wide —
# required for react-dom, r3f and ink to share a single React runtime.
catalog:
  react: 19.3.1
  react-dom: 19.3.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  typescript: 6.0.3
  vite: 8.3.0
  vitest: 5.0.1
  '@vitejs/plugin-react': 6.1.1
  three: 0.186.1
  '@types/three': 0.186.0
  '@react-three/fiber': 9.8.2
  '@react-three/uikit': 1.0.77
  '@react-three/drei': 10.7.9
  ink: 8.0.0

strictPeerDependencies: true
